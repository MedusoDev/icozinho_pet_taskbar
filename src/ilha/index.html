<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Doca do Icozinho</title>
  <style>
    :root {
      --fundo: rgba(16, 11, 26, 0.96);
      --fundo-2: rgba(255, 255, 255, 0.05);
      --linha: rgba(167, 139, 250, 0.28);
      --texto: #ede9fe;
      --fraco: #a1a1aa;
      --roxo: #7c3aed;
      --roxo-claro: #a78bfa;
      --ambar: #f59e0b;
      --verde: #34d399;
      --vermelho: #f4505e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--texto);
      font: 500 13px/1.4 'Segoe UI', sans-serif;
      user-select: none;
    }
    button { font: inherit; color: inherit; }

    /* ── o fio: a doca escondida, só uma linha de luz na borda ── */
    #fio {
      position: absolute;
      border-radius: 999px;
      background: rgba(167, 139, 250, 0.35);
      opacity: 0;
      transition: opacity 0.2s ease, background 0.3s ease;
      pointer-events: none;
    }
    body[data-modo='escondida'] #fio { opacity: 1; }
    body[data-lado='direita'] #fio { right: 2px; top: 10px; bottom: 10px; width: 4px; }
    body[data-lado='esquerda'] #fio { left: 2px; top: 10px; bottom: 10px; width: 4px; }
    body[data-lado='topo'] #fio { top: 2px; left: 10px; right: 10px; height: 4px; }
    body.atividade-trabalhando #fio { background: #a78bfa; animation: pulsar 1.6s ease-in-out infinite; }
    body.atividade-precisa #fio { background: var(--ambar); animation: pulsar 0.7s ease-in-out infinite; }
    body.atividade-pronto #fio { background: var(--verde); }
    body.atividade-erro #fio { background: var(--vermelho); }

    /* ── a aba: desliza para fora quando o mouse encosta na borda ── */
    #aba {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--fundo);
      border: 1px solid var(--linha);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45), 0 0 18px rgba(124, 58, 237, 0.22);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.22s ease, opacity 0.22s ease;
    }
    body[data-modo='aberta'] #aba { display: none; }
    #aba img { width: 34px; height: 34px; }
    /* nas laterais: uma aba vertical colada na borda */
    body[data-lado='direita'] #aba, body[data-lado='esquerda'] #aba {
      top: 6px;
      bottom: 6px;
      width: 66px;
      flex-direction: column;
    }
    body[data-lado='direita'] #aba { right: 0; border-right: 0; border-radius: 20px 0 0 20px; }
    body[data-lado='esquerda'] #aba { left: 0; border-left: 0; border-radius: 0 20px 20px 0; }
    body[data-lado='direita'][data-modo='escondida'] #aba { transform: translateX(110%); opacity: 0; }
    body[data-lado='esquerda'][data-modo='escondida'] #aba { transform: translateX(-110%); opacity: 0; }
    /* no topo: a pílula de antes */
    body[data-lado='topo'] #aba {
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 360px;
      height: 38px;
      padding: 0 14px 0 6px;
      border-radius: 999px;
    }
    body[data-lado='topo'] #aba img { width: 26px; height: 26px; }
    body[data-lado='topo'][data-modo='escondida'] #aba { transform: translate(-50%, -140%); opacity: 0; }
    #aba-texto { overflow: hidden; text-overflow: ellipsis; }
    body:not([data-lado='topo']) #aba-texto { display: none; }
    .linha-aba { display: flex; align-items: center; gap: 5px; }
    #aba-contador {
      background: var(--ambar);
      color: #1c1206;
      font-weight: 700;
      font-size: 11px;
      border-radius: 999px;
      padding: 0 7px;
    }
    #aba-contador:empty { display: none; }
    body.atividade-precisa #aba { border-color: var(--ambar); box-shadow: 0 0 24px rgba(217, 119, 6, 0.5); }

    .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--fraco); flex: none; }
    .ponto.pensando, .ponto.trabalhando { background: var(--roxo-claro); animation: pulsar 1s ease-in-out infinite; }
    .ponto.precisa { background: var(--ambar); animation: pulsar 0.7s ease-in-out infinite; }
    .ponto.pronto { background: var(--verde); }
    .ponto.erro { background: var(--vermelho); }
    @keyframes pulsar { 50% { opacity: 0.35; } }

    /* ── o painel ── */
    #painel {
      position: absolute;
      inset: 8px;
      display: none;
      flex-direction: column;
      border-radius: 22px;
      background: var(--fundo);
      border: 1px solid var(--linha);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55), 0 0 26px rgba(124, 58, 237, 0.25);
      overflow: hidden;
    }
    body[data-modo='aberta'] #painel { display: flex; }
    header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 8px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    header img { width: 24px; height: 24px; margin: 0 4px 0 2px; }
    .aba, .icone {
      border: 0;
      background: transparent;
      border-radius: 999px;
      padding: 5px 11px;
      color: var(--fraco);
      cursor: pointer;
    }
    .aba:hover, .icone:hover { background: var(--fundo-2); color: var(--texto); }
    .aba.ativa { background: rgba(124, 58, 237, 0.22); color: var(--texto); }
    .icone { padding: 5px 9px; }
    .icone.desligado { opacity: 0.45; }
    .espaco { flex: 1; }

    .aba-conteudo { display: none; flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 12px; }
    .aba-conteudo.ativa { display: flex; flex-direction: column; gap: 8px; }
    .aba-conteudo::-webkit-scrollbar { width: 6px; }
    .aba-conteudo::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.3); border-radius: 3px; }

    /* sessões */
    .sessao {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 2px 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--fundo-2);
    }
    .sessao .nome { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sessao .origem {
      font: 600 9.5px 'Cascadia Mono', Consolas, monospace;
      color: var(--roxo-claro);
      text-transform: uppercase;
      margin-left: 6px;
      opacity: 0.8;
    }
    .sessao .quando { color: var(--fraco); font-size: 11.5px; }
    .sessao .passo { grid-column: 2 / 4; color: var(--fraco); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vazio { color: var(--fraco); text-align: center; padding: 26px 10px; }
    .vazio .botao { margin-top: 10px; }

    /* cartões de pedido */
    .cartao {
      padding: 10px 12px 11px;
      border-radius: 14px;
      background: rgba(217, 119, 6, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.7);
    }
    .cartao .projeto {
      display: block;
      font: 600 9.5px/1.2 'Cascadia Mono', Consolas, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fbbf24;
      margin-bottom: 3px;
    }
    .cartao .titulo { display: block; font-size: 13.5px; margin-bottom: 6px; }
    .cartao .detalhe {
      display: block;
      max-height: 84px;
      overflow: auto;
      padding: 6px 8px;
      margin-bottom: 9px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      font: 11.5px/1.4 'Cascadia Mono', Consolas, monospace;
      color: #ddd6fe;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
    }
    .opcoes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .linha-outro { display: flex; gap: 6px; margin-bottom: 8px; }
    .acoes { display: flex; gap: 6px; align-items: center; }

    .botao {
      border: 1px solid rgba(167, 139, 250, 0.5);
      border-radius: 999px;
      padding: 5px 13px;
      background: rgba(124, 58, 237, 0.12);
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }
    .botao:hover { background: rgba(124, 58, 237, 0.3); }
    .botao:disabled { opacity: 0.4; cursor: default; }
    .primario { background: var(--roxo); border-color: #8b5cf6; color: #fff; }
    .primario:hover { background: #8b5cf6; }
    .perigo { border-color: rgba(244, 80, 94, 0.7); background: rgba(244, 80, 94, 0.12); }
    .perigo:hover { background: rgba(244, 80, 94, 0.3); }
    .discreto { border-color: transparent; background: transparent; color: var(--fraco); }
    .acoes .discreto { margin-left: auto; }
    .opcao.marcada { background: #d97706; border-color: var(--ambar); color: #fff; }
    .opcao.discreta { border-style: dashed; background: transparent; }

    .campo, textarea {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--linha);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.3);
      color: var(--texto);
      font: inherit;
      padding: 7px 10px;
      outline: none;
      user-select: text;
    }
    .campo:focus, textarea:focus { border-color: var(--roxo-claro); }

    /* conversa */
    #aba-conversa.ativa { padding-bottom: 10px; }
    #mensagens { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
    .mensagem {
      max-width: 88%;
      padding: 7px 11px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      user-select: text;
    }
    .mensagem.eu { align-self: flex-end; background: var(--roxo); color: #fff; border-bottom-right-radius: 5px; }
    .mensagem.icozinho { align-self: flex-start; background: var(--fundo-2); border-bottom-left-radius: 5px; }
    .mensagem.icozinho.digitando:empty::after { content: '…'; color: var(--fraco); }
    .mensagem.erro { background: rgba(244, 80, 94, 0.12); color: #fecdd3; }
    .mensagem.sistema { align-self: center; color: var(--fraco); font-size: 12px; background: none; }
    .entrada { display: flex; flex-direction: column; gap: 6px; }
    textarea { resize: none; }
    .botoes { display: flex; justify-content: flex-end; gap: 6px; }

    /* ajustes */
    .ajuste {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 12px;
      background: var(--fundo-2);
    }
    .ajuste small { display: block; color: var(--fraco); font-size: 11.5px; }
    .chave { position: relative; width: 36px; height: 20px; flex: none; }
    .chave input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .chave span { position: absolute; inset: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.15); transition: background 0.15s; pointer-events: none; }
    .chave span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .chave input:checked + span { background: var(--roxo); }
    .chave input:checked + span::after { transform: translateX(16px); }
    .lados { display: flex; gap: 4px; }
    .lados .botao.ativo { background: var(--roxo); border-color: #8b5cf6; color: #fff; }
    .titulo-secao { color: var(--roxo-claro); font: 600 10px 'Cascadia Mono', Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; margin: 6px 2px 0; }
  </style>
</head>
<body data-modo="escondida" data-lado="direita">
  <div id="fio"></div>
  <div id="aba" class="clicavel" title="Abrir o Icozinho">
    <img src="../../assets/icone.png" alt="" />
    <span class="linha-aba">
      <span id="aba-ponto" class="ponto"></span>
      <span id="aba-texto">Icozinho</span>
      <span id="aba-contador"></span>
    </span>
  </div>

  <div id="painel">
    <header>
      <img src="../../assets/icone.png" alt="" />
      <button class="aba ativa" data-aba="sessoes" type="button">Sessões</button>
      <button class="aba" data-aba="conversa" type="button">Conversa</button>
      <span class="espaco"></span>
      <button id="botao-prender" class="icone" type="button">📌</button>
      <button id="botao-som" class="icone" type="button" title="Sons">♪</button>
      <button class="icone" data-aba="ajustes" type="button" title="Ajustes">⚙</button>
      <button id="botao-recolher" class="icone" type="button" title="Recolher (Esc)">▴</button>
    </header>

    <section id="aba-sessoes" class="aba-conteudo ativa">
      <div id="pedidos" style="display: flex; flex-direction: column; gap: 8px"></div>
      <div id="lista-sessoes" style="display: flex; flex-direction: column; gap: 6px"></div>
    </section>

    <section id="aba-conversa" class="aba-conteudo">
      <div id="mensagens"></div>
      <div class="entrada">
        <textarea id="campo-conversa" rows="2" placeholder="Fala comigo… (Enter envia, Shift+Enter quebra a linha)"></textarea>
        <div class="botoes">
          <button id="nova-conversa" class="botao discreto" type="button">Conversa nova</button>
          <button id="enviar-conversa" class="botao primario" type="button">Enviar</button>
        </div>
      </div>
    </section>

    <section id="aba-ajustes" class="aba-conteudo">
      <div class="titulo-secao">Icozinho</div>
      <label class="ajuste">
        <span>Pet solto na barra de tarefas<small>Desligado, ele fica preso aqui na doca.</small></span>
        <span class="chave"><input type="checkbox" data-ajuste="petNaBarra" /><span></span></span>
      </label>
      <label class="ajuste">
        <span>Sons<small>Quando o Claude precisa de você ou termina.</small></span>
        <span class="chave"><input type="checkbox" data-ajuste="som" /><span></span></span>
      </label>
      <div class="ajuste">
        <span>Lugar da doca<small>Ela fica escondida na borda; encoste o mouse para ela sair.</small></span>
        <span class="lados">
          <button class="botao" type="button" data-lado="esquerda">Esquerda</button>
          <button class="botao" type="button" data-lado="topo">Topo</button>
          <button class="botao" type="button" data-lado="direita">Direita</button>
        </span>
      </div>
      <label class="ajuste">
        <span>Iniciar com o Windows</span>
        <span class="chave"><input type="checkbox" data-ajuste="iniciarComWindows" /><span></span></span>
      </label>
      <div class="titulo-secao">Claude Code</div>
      <div class="ajuste">
        <span id="claude-estado">…</span>
        <span id="claude-botoes" style="display: flex; gap: 6px"></span>
      </div>
    </section>
  </div>

  <script type="module" src="ilha.js"></script>
</body>
</html>
