<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Icozinho</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../../node_modules/three/build/three.module.js",
        "three/addons/": "../../node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    canvas { display: block; }
    #efeitos, #zzz { position: absolute; inset: 0; pointer-events: none; }

    .particula {
      position: absolute;
      font-family: 'Segoe UI', sans-serif;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    .coracao {
      font-size: 16px;
      text-shadow: 0 0 6px rgba(124, 58, 237, 0.6);
      animation: sobe 1.6s ease-out forwards;
    }
    @keyframes sobe {
      0%   { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -300%) scale(1.15); }
    }
    .estrela {
      font-size: 12px;
      color: #fde68a;
      text-shadow: 0 0 6px rgba(217, 119, 6, 0.8);
      animation: orbita 1.2s linear infinite;
    }
    @keyframes orbita {
      from { transform: translate(-50%, -50%) rotate(0deg) translateX(26px) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg) translateX(26px) rotate(-360deg); }
    }

    #zzz { inset: auto; display: none; width: 40px; height: 40px; }
    #zzz.visivel { display: block; }
    #zzz span {
      position: absolute;
      bottom: 0;
      opacity: 0;
      font: 600 12px 'Segoe UI', sans-serif;
      color: #c4b5fd;
      text-shadow: 0 0 8px rgba(124, 58, 237, 0.6);
      animation: z 2.4s ease-in-out infinite;
    }
    #zzz span:nth-child(2) { left: 9px; font-size: 16px; animation-delay: 0.55s; }
    #zzz span:nth-child(3) { left: 20px; font-size: 21px; animation-delay: 1.1s; }
    @keyframes z {
      0%   { opacity: 0; transform: translateY(0); }
      40%  { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-16px); }
    }
  </style>
</head>
<body>
  <canvas id="cena"></canvas>
  <div id="efeitos"></div>
  <div id="zzz"><span>z</span><span>z</span><span>z</span></div>
  <script type="module" src="pet.js"></script>
</body>
</html>
