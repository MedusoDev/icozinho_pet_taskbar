<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Icozinho</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../../node_modules/three/build/three.module.js",
        "three/addons/": "../../node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    canvas { display: block; }
    #efeitos, #zzz { position: absolute; inset: 0; pointer-events: none; }

    .particula {
      position: absolute;
      font-family: 'Segoe UI', sans-serif;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    .coracao {
      font-size: 16px;
      text-shadow: 0 0 6px rgba(124, 58, 237, 0.6);
      animation: sobe 1.6s ease-out forwards;
    }
    @keyframes sobe {
      0%   { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -300%) scale(1.15); }
    }
    .estrela {
      font-size: 12px;
      color: #fde68a;
      text-shadow: 0 0 6px rgba(217, 119, 6, 0.8);
      animation: orbita 1.2s linear infinite;
    }
    @keyframes orbita {
      from { transform: translate(-50%, -50%) rotate(0deg) translateX(26px) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg) translateX(26px) rotate(-360deg); }
    }

    /* O balão do Claude Code, em cima da gema */
    #balao {
      position: absolute;
      left: 0;
      top: 0;
      max-width: 300px;
      padding: 7px 12px 8px;
      border-radius: 14px;
      background: rgba(17, 12, 28, 0.92);
      border: 1px solid rgba(167, 139, 250, 0.45);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45), 0 0 18px rgba(124, 58, 237, 0.25);
      color: #ede9fe;
      font: 500 12.5px/1.35 'Segoe UI', sans-serif;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }
    #balao.visivel { opacity: 1; }
    body.com-cartao #balao { display: none; }
    #balao .projeto {
      display: block;
      font: 600 9.5px/1.2 'Cascadia Mono', Consolas, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 2px;
    }
    #balao .projeto:empty { display: none; }
    #balao .texto { display: block; overflow: hidden; text-overflow: ellipsis; }
    #balao[data-tipo='precisa'] { border-color: rgba(251, 191, 36, 0.8); box-shadow: 0 0 22px rgba(217, 119, 6, 0.45); }
    #balao[data-tipo='terminou'] { border-color: rgba(52, 211, 153, 0.7); }
    #balao[data-tipo='erro'], #balao[data-tipo='aviso'] { border-color: rgba(244, 80, 94, 0.75); }

    /* O cartão de permissão ou pergunta, clicável */
    #cartao {
      position: absolute;
      left: 0;
      top: 0;
      width: 300px;
      max-height: 230px;
      overflow: hidden;
      box-sizing: border-box;
      padding: 10px 12px 11px;
      border-radius: 16px;
      background: rgba(17, 12, 28, 0.96);
      border: 1px solid rgba(251, 191, 36, 0.8);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5), 0 0 24px rgba(217, 119, 6, 0.35);
      color: #ede9fe;
      font: 500 12.5px/1.35 'Segoe UI', sans-serif;
      display: none;
    }
    #cartao.visivel { display: block; }
    #cartao .projeto {
      display: block;
      font: 600 9.5px/1.2 'Cascadia Mono', Consolas, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fbbf24;
      margin-bottom: 3px;
    }
    #cartao .titulo { display: block; font-size: 13px; margin-bottom: 6px; }
    #cartao .detalhe {
      display: block;
      max-height: 48px;
      overflow: hidden;
      padding: 5px 7px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      font: 11px/1.35 'Cascadia Mono', Consolas, monospace;
      color: #ddd6fe;
      word-break: break-all;
    }
    #cartao .opcoes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    #cartao .acoes { display: flex; gap: 6px; }
    #cartao .botao {
      border: 1px solid rgba(167, 139, 250, 0.5);
      border-radius: 999px;
      padding: 5px 12px;
      background: rgba(124, 58, 237, 0.12);
      color: #ede9fe;
      font: 600 12px 'Segoe UI', sans-serif;
      cursor: pointer;
    }
    #cartao .botao:hover { background: rgba(124, 58, 237, 0.3); }
    #cartao .botao:disabled { opacity: 0.4; cursor: default; }
    #cartao .primario { background: #7c3aed; border-color: #8b5cf6; color: #fff; }
    #cartao .primario:hover { background: #8b5cf6; }
    #cartao .perigo { border-color: rgba(244, 80, 94, 0.7); background: rgba(244, 80, 94, 0.12); }
    #cartao .perigo:hover { background: rgba(244, 80, 94, 0.3); }
    #cartao .discreto { border-color: transparent; background: transparent; color: #a1a1aa; margin-left: auto; }
    #cartao .opcao.marcada { background: #d97706; border-color: #f59e0b; color: #fff; }

    #zzz { inset: auto; display: none; width: 40px; height: 40px; }
    #zzz.visivel { display: block; }
    #zzz span {
      position: absolute;
      bottom: 0;
      opacity: 0;
      font: 600 12px 'Segoe UI', sans-serif;
      color: #c4b5fd;
      text-shadow: 0 0 8px rgba(124, 58, 237, 0.6);
      animation: z 2.4s ease-in-out infinite;
    }
    #zzz span:nth-child(2) { left: 9px; font-size: 16px; animation-delay: 0.55s; }
    #zzz span:nth-child(3) { left: 20px; font-size: 21px; animation-delay: 1.1s; }
    @keyframes z {
      0%   { opacity: 0; transform: translateY(0); }
      40%  { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-16px); }
    }
  </style>
</head>
<body>
  <canvas id="cena"></canvas>
  <div id="efeitos"></div>
  <div id="zzz"><span>z</span><span>z</span><span>z</span></div>
  <div id="balao"><span class="projeto"></span><span class="texto"></span></div>
  <div id="cartao" class="clicavel"></div>
  <script type="module" src="pet.js"></script>
</body>
</html>
